<!DOCTYPE html>
<html lang="en">
  <head>
    <style>

      
      .first-name ,
      .last-name {
        width: 100px;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 5px;
        padding-right: 5px;
        border-radius: 5px;
        border-width: 1px;
        border: 1px solid gray;
        margin-bottom: 5px;
      }

      .email {
       display: block;
       width: 216px; 
       border-radius: 5px;
       border-width: 1px;
       border-color: gray;
       border: 1px solid gray;
       padding-top: 5px;
       padding-bottom: 5px;
       padding-left: 5px;
       padding-right: 5px;
       margin-bottom: 5px;
      }

      .sign-up {
        width: 228px;
        font-size: 16px;
        border: none;
        font-weight: bold;
        padding-top: 10px;
        padding-bottom: 10px;
        background-color: #2C62B4;
        color: white;
        border-radius: 5px;

      }
    </style>
  </head>
  <body>
    
    <input class="first-name" type="text" placeholder="First Name">
    <input class="last-name" type="text" placeholder="Last Name">
    <input class="email" type="email" placeholder="Email">
    <button class="sign-up">Sign Up</button>
    
    
  </body>
</html>
